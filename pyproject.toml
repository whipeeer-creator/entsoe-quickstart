[project]
name = "entsoe-quickstart"
version = "1.0.0"
description = "Single-file, dependency-free client for the ENTSO-E Transparency Platform"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "progrunners", email = "info@progrunners.com" }]
keywords = ["entsoe", "energy", "electricity", "power-markets", "day-ahead"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://progrunners.com/entso-e-api/"
Source = "https://github.com/whipeeer-creator/entsoe-quickstart"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["entsoe_quickstart"]
